name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-extras ccache git zlib1g-dev libffi-dev libssl-dev python3-pip \
          openjdk-17-jdk unzip wget

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython setuptools

    - name: Build APK with Buildozer
      run: |
        # Accept licenses automatically during build process
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexus-agent-apk
        path: bin/*.apk
        
