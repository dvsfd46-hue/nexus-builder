name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk git zip unzip libltdl-dev

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython setuptools

    - name: Initialize Buildozer Spec
      run: |
        # إنشاء ملف الإعدادات افتراضياً إذا لم يكن موجوداً
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        # تعديل اسم التطبيق وحزم الأندرويد تلقائياً داخل الملف
        sed -i 's/# title = my Application/title = Nexus Remote/' buildozer.spec
        sed -i 's/# package.name = myapp/package.name = nexusremote/' buildozer.spec
        sed -i 's/# package.domain = org.test/package.domain = org.nexus/' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexus-agent-apk
        path: bin/*.apk
